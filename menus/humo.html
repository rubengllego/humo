<style id="lace-menu-css">
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
.lm-fab{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);z-index:60;width:48px;height:48px;border-radius:50%;border:1px solid rgba(245,240,231,.45);background:rgba(18,15,13,.88);color:#f5f0e7;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lm-fab.lm-show{opacity:1;transform:none}
.lm-fab span{display:block;width:18px;height:2px;background:currentColor;position:relative;transition:background .2s}
.lm-fab span::before,.lm-fab span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:currentColor;transition:transform .2s}
.lm-fab span::before{top:-6px}.lm-fab span::after{top:6px}
.lm-fab[aria-expanded="true"] span{background:transparent}
.lm-fab[aria-expanded="true"] span::before{transform:translateY(6px) rotate(45deg)}
.lm-fab[aria-expanded="true"] span::after{transform:translateY(-6px) rotate(-45deg)}
.lm-sheet{position:fixed;left:0;right:0;top:0;z-index:55;background:rgba(18,15,13,.97);color:#f5f0e7;padding:calc(env(safe-area-inset-top,0px) + 76px) max(22px,env(safe-area-inset-right,0px)) 26px max(22px,env(safe-area-inset-left,0px));box-shadow:0 24px 40px -20px rgba(0,0,0,.6);max-height:100vh;overflow:auto}
.lm-sheet a{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;text-decoration:none;color:inherit;font-size:1.05rem;letter-spacing:.02em;border-bottom:1px solid rgba(245,240,231,.16)}
.lm-sheet a::after{content:"\2192";opacity:.5}
.lm-sheet a.lm-cta{justify-content:center;margin-top:18px;border:1px solid rgba(245,240,231,.6);padding:15px;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.lm-sheet a.lm-cta::after{content:none}
@media (max-width:820px){.lm-fab{display:flex}}
@media (min-width:821px){.lm-sheet{display:none!important}}
@media (prefers-reduced-motion:reduce){.lm-fab,.lm-fab span,.lm-fab span::before,.lm-fab span::after{transition:none}}
</style>
<script id="lace-menu-js">
(function(){
var items=[["Inicio", ".hero", "inicio-top"], ["La cocina", "#cocina", ""], ["Para compartir", ".table-section", "compartir"], ["El fuego lento", ".offer", "brasa"], ["El ambiente", "#ambiente", ""], ["Dónde estamos", "#visitanos", ""]];
var cta=document.querySelector('a[href*="wa.me"]');
var b=document.createElement('button');b.type='button';b.className='lm-fab';b.setAttribute('aria-label','Abrir menú');b.setAttribute('aria-expanded','false');b.setAttribute('aria-controls','lm-panel');b.innerHTML='<span></span>';
var p=document.createElement('div');p.id='lm-panel';p.className='lm-sheet';p.hidden=true;p.setAttribute('role','navigation');p.setAttribute('aria-label','Menú de la web');
items.forEach(function(it){var el=document.querySelector(it[1]);if(!el)return;if(!el.id)el.id=it[2];var a=document.createElement('a');a.href='#'+el.id;a.textContent=it[0];p.appendChild(a);});
if(cta){var c=document.createElement('a');c.href=cta.href;c.target='_blank';c.rel='noopener';c.className='lm-cta';c.textContent='Reservar por WhatsApp';p.appendChild(c);}
document.body.appendChild(p);document.body.appendChild(b);
function set(open){p.hidden=!open;b.setAttribute('aria-expanded',open?'true':'false');b.setAttribute('aria-label',open?'Cerrar menú':'Abrir menú');vis();}
function vis(){var show=window.scrollY>260||!p.hidden;b.classList.toggle('lm-show',show);b.style.pointerEvents=show?'auto':'none';}
b.addEventListener('click',function(e){e.stopPropagation();set(p.hidden);});
p.addEventListener('click',function(e){if(e.target.closest('a'))set(false);});
document.addEventListener('click',function(e){if(!p.hidden&&!p.contains(e.target)&&e.target!==b)set(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!p.hidden){set(false);b.focus();}});
window.addEventListener('scroll',vis,{passive:true});window.addEventListener('resize',function(){if(window.innerWidth>820)set(false);});vis();
})();
</script>
